<svg width="0" height="0" style="position:absolute"><symbol id="lg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#82f6e7"/><stop offset="1" stop-color="#2878c8"/></linearGradient><mask id="mk"><rect width="64" height="64" fill="#fff"/><circle cx="39" cy="26" r="11" fill="#000"/></mask></defs><ellipse cx="12" cy="17" rx="10" ry="5.5" transform="rotate(-30 12 17)" fill="#82f6e7" opacity=".28"/><ellipse cx="52" cy="17" rx="10" ry="5.5" transform="rotate(30 52 17)" fill="#82f6e7" opacity=".28"/><path d="M32 7l21 12v24L32 57 11 43V19z" fill="#042b50" stroke="url(#g)" stroke-width="2.6" stroke-linejoin="round"/><circle cx="30" cy="31" r="14" fill="url(#g)" mask="url(#mk)"/><path d="M40 20c3 4 4.6 6.2 4.6 8.6a4.6 4.6 0 0 1-9.2 0c0-2.4 1.6-4.6 4.6-8.6z" fill="#f8bd45"/><path d="M13 42h11l4-8 5 13 4-9 2 4h12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<div id="ph" class="relative mx-auto w-full max-w-[430px] h-[100dvh] md:h-[min(900px,96dvh)] md:my-[2dvh] md:rounded-[36px] md:border md:border-s4 overflow-hidden bg-[#00142b] shadow-2xl">

</div>
<script>
const $=s=>document.querySelector(s),I=(n,c='')=>`<span class="material-symbols-outlined ${c}">${n}</span>`,v=$('#v'),ov=$('#ov'),tst=$('#tst');
const S={scr:'login',role:'p',glu:138,gt:'06:30',bed:'22:45',watch:1,sel:'b',met:0,day:15,mo:9,sub:0,ref:0,psg:0,sync:'07:15',syncd:0,sim:1,play:0,sec:0,tk:[1,0,0,0],notes:[],log:'Bangun buang air kecil 2 kali, merasa agak haus dan lelah saat bangun pagi.',ci:0,rd:5,acc:0};
const m2t=m=>{m=(m+1440)%1440;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')},t2m=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const tt=m=>{tst.textContent=m;tst.style.opacity=1;tst.style.transform='translate(-50%,0)';clearTimeout(tt.i);tt.i=setTimeout(()=>{tst.style.opacity=0;tst.style.transform='translate(-50%,20px)'},2400)};
const sh=h=>{ov.innerHTML=`<div data-a="x" class="absolute inset-0 bg-black/60 backdrop-blur-sm z-40"></div><div class="absolute bottom-0 inset-x-0 z-50 bg-s3 rounded-t-3xl p-5 pb-8 max-h-[85%] overflow-y-auto flex flex-col gap-3" style="animation:up .3s"><div class="w-10 h-1 rounded-full bg-mu/30 mx-auto"></div>${h}</div>`};
const x=()=>{clearInterval(S.bi);ov.innerHTML=''};
const bd=(t,c)=>`<span class="px-2 py-0.5 rounded-full text-[10px] font-h font-medium whitespace-nowrap ${c}">${t}</span>`;
const bt=(a,ic,t,c='bg-pc text-white',val='')=>`<button data-a="${a}" data-v="${val}" class="w-full min-h-12 rounded-xl px-4 py-3 font-h font-semibold flex items-center justify-center gap-2 text-center ${c}">${I(ic)}${t}</button>`;
const sc=(ic,t,r='')=>`<div class="flex items-center justify-between gap-2 px-1"><div class="flex items-center gap-2 font-h font-semibold">${I(ic,'text-sc')}${t}</div>${r}</div>`;
const nt=(t)=>`<div class="c bg-s0 text-xs text-mu leading-5 flex gap-3">${I('verified_user','text-p shrink-0')}<p>${t}</p></div>`;
const tl=(l,ic,icc,val,u,s,scc,ex='')=>`<div class="c flex flex-col justify-between gap-2"><div class="flex justify-between items-center text-mu text-xs font-h">${l}${I(ic,icc)}</div><div class="h text-[22px] flex items-baseline gap-1">${val}<span class="text-xs text-mu">${u}</span></div><div class="text-xs leading-4 ${scc}">${s}</div>${ex}</div>`;
const bar=(w,c)=>`<div class="h-1.5 rounded-full bg-s3 overflow-hidden"><div class="h-full rounded-full ${c}" style="width:${w}%"></div></div>`;
const cn=(n,d=0)=>`<b class="font-semibold" data-n="${n}" data-d="${d}">${n}</b>`;

/* ===== SCREENS ===== */
const R={};
const SL=[['vital_signs','Pilar 01','Sinkronisasi Wearable & HRV Nokturnal','Memantau kedalaman fase tidur gelombang lambat dan pemulihan sistem saraf otonom sepanjang malam untuk stabilitas gula darah puasa.'],['airwave','Pilar 02','Skrining Cerdas Risiko OSA','Deteksi dini henti napas obstruktif malam hari untuk memutus lonjakan kortisol nokturnal pemicu resistensi insulin mendadak.'],['psychology_alt','Pilar 03','Program Digital CBT-I Terstruktur','Protokol terapi kognitif perilaku insomnia 6–9 minggu terbukti klinis memulihkan efisiensi tidur & menurunkan estimasi biomarker HbA1c.']];
R.login=()=>`<div class="text-center flex flex-col items-center gap-2"><svg class="w-24 h-24 glow" style="animation:up .8s"><use href="#lg"/></svg><h1 class="h text-4xl font-bold tracking-tight">DIA<span class="text-sc">BEEP</span></h1><p class="h text-p">Sleep Intelligence for Diabetes Care</p><span class="px-3 py-1.5 rounded-full bg-s3 text-sc text-[11px] font-h flex items-center gap-1.5"><i class="w-1.5 h-1.5 rounded-full bg-sc pl"></i>Digital Therapeutic Tidur & Kendali Glikemik (HKN FKM UNDIP 2026)</span></div>
<div><div class="overflow-hidden rounded-2xl"><div id="cr" class="flex" style="transition:transform .5s">${SL.map(s=>`<div class="c bg-s3 w-full shrink-0 flex flex-col gap-3 min-h-[200px]"><div class="flex justify-between items-center"><span class="w-11 h-11 rounded-xl bg-s4 text-sc flex items-center justify-center">${I(s[0],'!text-2xl')}</span>${bd(s[1],'bg-sc/15 text-sc')}</div><h3 class="h text-lg font-medium leading-6">${s[2]}</h3><p class="text-sm text-mu leading-5">${s[3]}</p></div>`).join('')}</div></div><div class="flex justify-center gap-2 mt-3">${[0,1,2].map(i=>`<button data-a="cs" data-v="${i}" id="d${i}" aria-label="Slide ${i+1}" class="h-2 rounded-full t ${i?'w-2 bg-s4':'w-7 bg-sc'}"></button>`).join('')}</div></div>
<div class="bg-s0 rounded-2xl p-1.5 flex gap-1.5"><button id="r_p" data-a="role" data-v="p" class="flex-1 min-h-11 rounded-xl font-h text-sm flex items-center justify-center gap-2 bg-s3 text-p">${I('person')}Pasien DMT2</button><button id="r_n" data-a="role" data-v="n" class="flex-1 min-h-11 rounded-xl font-h text-sm flex items-center justify-center gap-2 text-mu">${I('stethoscope')}Dokter / Nakes</button></div>
<div class="flex flex-col gap-4"><label class="flex flex-col gap-2"><span class="flex justify-between text-xs font-h text-p">No. Rekam Medis (RM) atau Surel<b class="text-sc font-medium">Enkripsi 256-bit</b></span><span class="flex items-center gap-3 bg-s3 rounded-xl px-4 min-h-14">${I('fingerprint','text-mu')}<input id="lu" class="bg-transparent flex-1 outline-none text-sm min-w-0" placeholder="RM-2026-9082 atau surel@undip.ac.id"></span></label>
<label class="flex flex-col gap-2"><span class="flex justify-between text-xs font-h text-p">Kata Sandi Portabel<button type="button" data-a="tt" data-v="Tautan reset dikirim ke surel terdaftar" class="text-p underline">Lupa Sandi?</button></span><span class="flex items-center gap-3 bg-s3 rounded-xl px-4 min-h-14">${I('lock','text-mu')}<input id="lp" type="password" class="bg-transparent flex-1 outline-none text-sm min-w-0" placeholder="••••••••••••"><button type="button" data-a="eye" class="text-mu" aria-label="Tampilkan sandi">${I('visibility')}</button></span></label></div>
<div class="c bg-s0 flex flex-col gap-3"><div class="flex items-center gap-2 text-[11px] font-h font-semibold text-p uppercase tracking-wide">${I('verified_user','!text-base')}Persetujuan Etika Digital Therapeutics</div>
<label class="flex gap-3 text-sm text-mu leading-5"><input id="k0" type="checkbox" class="w-6 h-6 shrink-0 accent-[#19a295]">Saya menyetujui <u class="text-p">Kebijakan Privasi Data Kesehatan Terenkripsi</u> sesuai regulasi SATUSEHAT Kemenkes RI.</label>
<label class="flex gap-3 text-sm text-mu leading-5"><input id="k1" type="checkbox" class="w-6 h-6 shrink-0 accent-[#19a295]"><span>Paham bahwa DIABEEP adalah instrumen skrining & terapi perilaku, <b class="text-white">BUKAN</b> pengganti nasihat dokter langsung maupun glukometer darah invasif.</span></label></div>
<div class="flex flex-col gap-3"><button id="lb" data-a="login" class="w-full min-h-14 rounded-xl bg-pc text-white font-h font-semibold flex items-center justify-center gap-2 shadow-[0_0_24px_rgba(40,120,200,.4)]">Masuk ke Akun Saya ${I('arrow_forward')}</button>${bt('tt','person_add','Daftar Akun Baru Pasien','bg-s2 text-sc','Pendaftaran dibuka untuk pasien terdaftar FKM UNDIP')}</div>
<div class="c bg-s3 flex flex-col gap-2"><div class="flex justify-between items-center text-[11px] font-h font-semibold text-tc uppercase">${I('science','!text-base')}<span class="flex-1 ml-2">Akses Riset Eksperimental</span>${bd('Sandbox','bg-tc text-s0')}</div><div class="flex items-center justify-between gap-3"><div><div class="h font-medium">Tn. Bambang (46 th)</div><div class="text-xs text-mu leading-4 mt-1">DMT2 Awitan 3 Thn • HbA1c 7.8% • Skor STOP-Bang 5</div></div><button data-a="demo" class="shrink-0 min-h-11 px-4 rounded-xl bg-tc text-s0 font-h font-semibold text-sm flex items-center gap-1.5">Buka Demo ${I('bolt','!text-base')}</button></div></div>
<p class="text-center text-[11px] text-mu/70 leading-5">Dikembangkan oleh Inisiatif Digital Therapeutics FKM Universitas Diponegoro<br>Standar Telemonitoring Nokturnal Terpadu © 2026</p>`;

R.home=()=>{const g=S.glu,st=g>180?['Tinggi','bg-er/20 text-er']:g>130?['Terkendali Sedang','bg-sc/15 text-sc']:['Terkendali Baik','bg-sc/15 text-sc'];
return `<div class="c bg-s3 relative overflow-hidden"><div class="flex justify-between items-center text-[11px] font-h"><span class="px-2.5 py-1 rounded-full bg-p/10 text-p flex items-center gap-1.5"><i class="w-1.5 h-1.5 rounded-full bg-sc pl"></i>Data Demo Pasien Terpantau (T2D)</span><span class="text-sc flex items-center gap-1">${I('sensors','!text-base')}Aktif</span></div><h1 class="h text-[22px] font-medium mt-3">Selamat Pagi, Pak Bambang 👋</h1><p class="text-xs text-mu flex items-center gap-1.5 mt-1">${I('watch','!text-base text-sc')}Sinkronisasi SmartBand ${S.sync} WIB • Terhubung</p></div>
<button data-a="go" data-v="ana" class="c flex items-center justify-between gap-3 text-left"><span class="flex items-center gap-3 min-w-0"><span class="relative w-11 h-11 rounded-full bg-tc/15 text-tc flex items-center justify-center shrink-0">${I('bedtime')}<i class="absolute top-1 right-1 w-2.5 h-2.5 rounded-full bg-tc pl"></i></span><span class="min-w-0"><span class="block text-[10px] font-h font-semibold text-tc uppercase tracking-wider">Triage Nokturnal</span><span class="block h text-lg leading-6">Status: Perlu Perhatian</span><span class="block text-xs text-mu">Fragmentasi tidur ringan tercatat</span></span></span>${I('chevron_right','text-mu')}</button>
<div class="flex flex-col gap-2"><div class="flex justify-between px-1 font-h text-sm"><b class="font-semibold">Metrik Tidur Semalam</b><span class="text-p">6–7 Jam Optimal</span></div><div class="grid grid-cols-2 gap-2">
${tl('Durasi Tidur','alarm','text-p','6j 18m','','↓ -42 mnt dari target','text-er',bar(78,'bg-p'))}
${tl('Efisiensi Tidur','speed','text-tc',cn(78)+'%','','Target aman >85%','text-tc',bar(78,'bg-tc'))}
${tl('HRV Nokturnal','monitor_heart','text-sc',cn(34),'ms','Rata-rata: 38 ms (Stres)','text-mu','<div class="text-[11px] text-sc flex items-center gap-1">'+I('info','!text-sm')+'Simpatis aktif</div>')}
${tl('Fragmentasi','power_settings_new','text-tc',cn(4)+' kali','','Terjaga 48 mnt total','text-mu','<div class="text-[11px] text-mu flex items-center gap-1">'+I('nightlight','!text-sm')+'Bangun malam</div>')}</div></div>
<div class="c bg-s3 flex flex-col gap-3"><div class="flex justify-between items-start gap-2"><div><div class="text-xs text-mu font-h">Glukosa Darah Puasa (Pagi)</div><div class="h text-4xl font-semibold mt-1">${cn(g)} <span class="text-sm text-mu font-normal">mg/dL</span></div></div>${bd('● '+st[0],st[1]+' !text-[11px] !py-1')}</div><div class="bg-s0 rounded-lg px-3 py-2 text-xs flex items-center gap-2">${I('edit_note','!text-base text-mu')}Diinput manual jam ${S.gt} WIB</div><button data-a="glu" class="min-h-12 rounded-xl bg-p text-s0 font-h font-semibold flex items-center justify-center gap-2">${I('add_circle')}+ Catat / Koreksi Glukosa Manual</button><p class="text-xs text-mu leading-5 flex gap-2">${I('info','!text-base shrink-0')}Input manual atau sinkron glukometer Bluetooth kompatibel; sensor wearable tidak mengukur glukosa langsung.</p></div>
<div class="c bg-gradient-to-br from-[#0b5e63] to-s3 flex flex-col gap-3"><div class="flex justify-between text-[11px] font-h"><span class="px-2.5 py-1 rounded-full bg-s0/50 text-sc">Program CBT-I • Minggu 3</span><span class="text-sc/80 self-center">Modul 3/8</span></div><h3 class="h text-xl font-medium">Mengatasi Kekhawatiran Malam</h3><p class="text-sm text-mu leading-5">Hari 4 dari 7 • Target Efisiensi Tidur >80% tercapai bertahan</p>${bar(57,'bg-sc')}<button data-a="relax" class="min-h-12 rounded-xl bg-s0/80 text-sc font-h font-semibold flex items-center justify-center gap-2 px-3 text-center">${I('self_improvement')}Mulai Latihan Relaksasi & Catat Jurnal (10 Mnt)</button></div>
<div class="flex flex-col gap-2"><b class="px-1 font-h font-semibold text-sm">Akses Pintasan Klinis</b><div class="grid grid-cols-3 gap-2">${[['rx','menu_book','Rekomendasi Hari Ini'],['ana','query_stats','Korelasi Glukosa'],['cal','event_available','Jadwal Nakes']].map(a=>`<button data-a="go" data-v="${a[0]}" class="c min-h-[104px] flex flex-col items-center justify-center gap-2 text-xs font-h text-center hover:bg-s3"><span class="w-11 h-11 rounded-full bg-s3 text-tc flex items-center justify-center">${I(a[1])}</span>${a[2]}</button>`).join('')}</div></div>
${nt('<b class="text-white">Pemberitahuan Klinis:</b> DIABEEP adalah sistem pendampingan digital & skrining; evaluasi berkala tetap dilakukan bersama dokter Anda.')}`};

const HY=[[0,0],[25,2],[70,3],[95,0],[102,2],[150,3],[190,2],[215,0],[222,1],[250,2],[300,3],[330,2],[350,0],[358,2],[400,1],[430,2],[445,0],[452,2],[485,2]],LV=['Terjaga','REM','Tidur Ringan','Tidur Nyenyak'];
R.sleep=()=>{let d='',dots='';HY.forEach(([t,l],i)=>{const X=t/485*300,Y=10+l*24;d+=i?`H${X}V${Y}`:`M${X} ${Y}`;if(l==0&&i>1)dots+=`<circle cx="${X}" cy="10" r="3.5" fill="#f8bd45"/>`});
return `<div class="c bg-s3 flex items-center justify-between gap-2 !p-3 text-xs"><span class="flex items-center gap-2 min-w-0"><i class="w-2 h-2 rounded-full bg-sc pl shrink-0"></i>${S.sim?'[Tersambung] Mode Simulasi Aktif (Data Sensor Terverifikasi)':'[Tersambung] Perangkat Nyata (SmartBand SleepTracker v3)'}</span><button data-a="mode" class="shrink-0 min-h-9 px-3 rounded-lg bg-s4 text-p font-h">Ubah Status</button></div>
<div class="c bg-s3 flex flex-col gap-3"><div class="flex items-start justify-between gap-3"><div class="flex gap-3 min-w-0"><span class="w-12 h-12 rounded-xl bg-s4 text-p flex items-center justify-center shrink-0">${I('watch','!text-2xl')}</span><div class="min-w-0"><div class="h font-semibold leading-5">SmartBand SleepTracker v3</div><div class="mt-1">${bd('BLE 5.2','bg-p/15 text-p')}</div></div></div><div class="text-right text-sc font-h text-sm shrink-0 flex items-center gap-1">${I('battery_5_bar','!text-base')}84%<br></div></div><p class="text-xs text-mu">Sinkronisasi Terakhir: ${S.syncd?'baru saja':'15 menit lalu'} (${S.sync} WIB)</p><div class="grid grid-cols-3 gap-2 text-center">${[['Laju Sampel','100 Hz PPG'],['Skin Temp','35.9 °C'],['Kehilangan Data','0.2% (Minimal)']].map(a=>`<div class="bg-s0 rounded-lg p-2"><div class="text-[10px] text-mu font-h">${a[0]}</div><div class="h text-sm font-medium mt-1">${a[1]}</div></div>`).join('')}</div></div>
<div class="c flex flex-col gap-4"><div class="flex justify-between items-start gap-3"><div><div class="flex items-center gap-2 text-sc font-h font-semibold text-sm">${I('bedtime','!text-base')}Arsitektur Tidur Semalam</div><div class="h text-4xl font-semibold mt-2">6<span class="text-lg">j</span> 18<span class="text-lg">m</span></div><div class="text-xs text-mu leading-5">(Efisiensi: 78.1%)<br>Total waktu di ranjang: 8 Jam 04 Menit</div></div><div class="bg-s3 rounded-xl p-3 text-center shrink-0"><div class="text-[10px] text-mu font-h">Skor Tidur</div><div class="h text-3xl text-tc font-semibold">${cn(72)}</div><div class="text-[10px] text-tc">Perlu Perhatian</div></div></div>
<div><div class="flex justify-between text-[10px] text-mu font-h mb-1.5"><span>Distribusi Tahapan</span><span>Target Ideal DiabCare</span></div><div class="flex h-3 rounded-full overflow-hidden gap-px"><button data-a="tt" data-v="Deep 54 mnt (14%)" class="bg-sc" style="width:11%" aria-label="Deep"></button><button data-a="tt" data-v="REM 1j 06m (17%)" class="bg-p" style="width:14%" aria-label="REM"></button><button data-a="tt" data-v="Light 4j 18m (69%)" class="bg-pc" style="width:53%" aria-label="Light"></button><button data-a="tt" data-v="Awake 48 mnt" class="bg-tc" style="width:22%" aria-label="Awake"></button></div></div>
